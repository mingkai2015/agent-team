services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: agent-team-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: agent-team-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

volumes:
  redis_data:

networks:
  agent-network:
    driver: bridge
